<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Build Your AI Second Brain 201 — 15s reel (Kinetic Type)</title>
    <style>
      :root {
        --canvas: #0a0e1a;
        --canvas-alt: #111827;
        --card: #1f2937;
        --text: #e8ecf4;
        --accent: #00d4ff;
        --muted: #9ca3af;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--canvas);
        font-family: "Space Grotesk", "Inter Tight", "Inter", system-ui, sans-serif;
        color: var(--text);
      }
      [data-composition-id="book-3b-second-brain-201-kinetic"] {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: linear-gradient(180deg, #0a0e1a 0%, #111827 100%);
        overflow: hidden;
      }
      [data-composition-id="book-3b-second-brain-201-kinetic"]::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 45%,
          rgba(0, 212, 255, 0.12) 0%,
          rgba(0, 0, 0, 0) 60%
        );
        pointer-events: none;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }
      .scene-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 120px 80px;
        gap: 32px;
        box-sizing: border-box;
        text-align: center;
      }
      .kinetic {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }
      .kinetic .word {
        font-family: "Space Grotesk", "Inter Tight", "Inter", sans-serif;
        font-size: 220px;
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.04em;
        color: var(--text);
      }
      .kinetic .word.accent {
        color: var(--accent);
        text-shadow: 0 0 40px rgba(0, 212, 255, 0.35);
      }
      .kinetic .word.small {
        font-size: 160px;
      }
      .reveal-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }
      .reveal-kicker {
        font-family: "Inter", sans-serif;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .reveal-cover {
        width: 540px;
        height: 810px;
        object-fit: cover;
        border-radius: 8px;
        background: var(--card);
        box-shadow:
          0 50px 100px rgba(0, 0, 0, 0.7),
          0 16px 32px rgba(0, 0, 0, 0.4),
          0 0 0 1px rgba(0, 212, 255, 0.08);
      }
      .reveal-author {
        font-family: "Inter", sans-serif;
        font-size: 28px;
        color: var(--muted);
      }
      .reveal-author .name {
        color: var(--text);
        font-weight: 600;
      }
      .cta-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }
      .cta-logo {
        width: 110px;
        height: 110px;
        object-fit: contain;
      }
      .cta-title {
        font-family: "Space Grotesk", "Inter Tight", "Inter", sans-serif;
        font-size: 124px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
        max-width: 920px;
      }
      .cta-title .accent {
        color: var(--accent);
      }
      .cta-button {
        display: inline-block;
        padding: 32px 72px;
        border-radius: 8px;
        background: var(--accent);
        font-family: "Inter", sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--canvas);
        box-shadow: 0 0 32px rgba(0, 212, 255, 0.4);
      }
      .cta-url {
        font-family: "JetBrains Mono", "Inter", monospace;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 0.18em;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="book-3b-second-brain-201-kinetic"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div id="scene-kinetic" class="scene">
        <div class="scene-content">
          <div class="kinetic">
            <span id="word-1" class="word">NOTES</span>
            <span id="word-2" class="word">TO</span>
            <span id="word-3" class="word accent">INSIGHTS</span>
            <span id="word-4" class="word small">201</span>
          </div>
        </div>
      </div>

      <div id="scene-reveal" class="scene">
        <div class="scene-content">
          <div class="reveal-wrap">
            <div id="reveal-kicker" class="reveal-kicker">Deepify Academy · Book 3b</div>
            <img
              id="reveal-cover"
              class="reveal-cover"
              src="cover.png"
              alt="Build Your AI Second Brain 201 book cover"
            />
            <div id="reveal-author" class="reveal-author">
              by <span class="name">Jake Cusack</span>
            </div>
          </div>
        </div>
      </div>

      <div id="scene-cta" class="scene">
        <div class="scene-content">
          <div class="cta-wrap">
            <img id="cta-logo" class="cta-logo" src="logo.png" alt="Deepify Academy" />
            <div id="cta-title" class="cta-title">Connect the <span class="accent">dots</span></div>
            <div id="cta-button" class="cta-button">Read on Amazon</div>
            <div id="cta-url" class="cta-url">deepify.ai</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.set("#scene-kinetic", { opacity: 1 }, 0);
      tl.set("#scene-reveal", { opacity: 0 }, 0);
      tl.set("#scene-cta", { opacity: 0 }, 0);

      tl.set(["#word-1", "#word-2", "#word-3", "#word-4"], { opacity: 0, y: 60, scale: 0.9 }, 0);

      tl.to("#word-1", { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, 0.2);
      tl.to("#word-2", { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 1.1);
      tl.to("#word-3", { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out" }, 2.2);
      tl.to("#word-4", { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power2.out" }, 3.4);

      tl.to("#word-3", { letterSpacing: "-0.06em", duration: 0.6, ease: "power2.inOut" }, 4.0);

      tl.to(".kinetic", { scale: 0.85, y: -40, duration: 0.6, ease: "power2.inOut" }, 6.8);

      tl.to("#scene-kinetic", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 7.8);
      tl.to("#scene-reveal", { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 7.8);

      tl.from("#reveal-kicker", { y: -20, opacity: 0, duration: 0.5, ease: "power2.out" }, 8.2);
      tl.from("#reveal-cover", { y: 60, opacity: 0, duration: 0.8, ease: "expo.out" }, 8.4);
      tl.from("#reveal-author", { y: 18, opacity: 0, duration: 0.5, ease: "power3.out" }, 9.2);

      tl.to("#scene-reveal", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 12.0);
      tl.to("#scene-cta", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12.0);

      tl.from("#cta-logo", { scale: 0.7, opacity: 0, duration: 0.5, ease: "expo.out" }, 12.2);
      tl.from("#cta-title", { y: 40, opacity: 0, duration: 0.6, ease: "expo.out" }, 12.5);
      tl.from("#cta-button", { y: 22, opacity: 0, duration: 0.5, ease: "power3.out" }, 13.1);
      tl.from("#cta-url", { opacity: 0, duration: 0.4, ease: "power2.out" }, 13.5);

      window.__timelines["book-3b-second-brain-201-kinetic"] = tl;
    </script>
  </body>
</html>
