<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Build Your Own AI Agent — 15s reel (Hero Cover)</title>
    <style>
      :root {
        --canvas: #0a0e1a;
        --canvas-alt: #111827;
        --card: #1f2937;
        --text: #e8ecf4;
        --accent: #00d4ff;
        --accent-2: #7b61ff;
        --muted: #9ca3af;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--canvas);
        font-family: "Inter", system-ui, sans-serif;
        color: var(--text);
      }
      [data-composition-id="book-voice-agent-hero"] {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: linear-gradient(180deg, #0a0e1a 0%, #111827 100%);
        overflow: hidden;
      }
      [data-composition-id="book-voice-agent-hero"]::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 35%,
          rgba(0, 212, 255, 0.1) 0%,
          rgba(0, 0, 0, 0) 60%
        );
        pointer-events: none;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }
      .scene-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 120px 80px;
        gap: 48px;
        box-sizing: border-box;
        text-align: center;
      }
      .cover-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 56px;
      }
      .kicker {
        font-family: "Inter", sans-serif;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .cover {
        width: 600px;
        height: 900px;
        object-fit: cover;
        border-radius: 8px;
        background: var(--card);
        box-shadow:
          0 50px 100px rgba(0, 0, 0, 0.7),
          0 16px 32px rgba(0, 0, 0, 0.4),
          0 0 0 1px rgba(0, 212, 255, 0.08);
      }
      .author {
        font-family: "Inter", sans-serif;
        font-size: 30px;
        font-weight: 400;
        color: var(--muted);
      }
      .author .name {
        color: var(--text);
        font-weight: 600;
      }
      .tagline {
        font-family: "Space Grotesk", "Inter Tight", "Inter", sans-serif;
        font-weight: 700;
        font-size: 108px;
        line-height: 1.04;
        letter-spacing: -0.02em;
        max-width: 920px;
      }
      .tagline .line {
        display: block;
      }
      .tagline .accent {
        color: var(--accent);
      }
      .rule {
        width: 160px;
        height: 3px;
        background: var(--accent);
        box-shadow: 0 0 16px rgba(0, 212, 255, 0.6);
      }
      .benefits {
        display: flex;
        flex-direction: column;
        gap: 56px;
        align-items: flex-start;
        max-width: 900px;
      }
      .benefit {
        display: flex;
        align-items: center;
        gap: 36px;
        font-family: "Space Grotesk", "Inter Tight", "Inter", sans-serif;
        font-size: 76px;
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      .benefit .num {
        width: 84px;
        height: 84px;
        border-radius: 10px;
        background: var(--accent);
        color: var(--canvas);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", sans-serif;
        font-weight: 800;
        font-size: 40px;
        flex-shrink: 0;
        box-shadow: 0 0 24px rgba(0, 212, 255, 0.3);
      }
      .benefit .accent {
        color: var(--accent);
      }
      .cta-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }
      .cta-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
      }
      .cta-kicker {
        font-family: "Inter", sans-serif;
        font-size: 24px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .cta-title {
        font-family: "Space Grotesk", "Inter Tight", "Inter", sans-serif;
        font-size: 124px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
        max-width: 920px;
      }
      .cta-title .accent {
        color: var(--accent);
      }
      .cta-button {
        display: inline-block;
        padding: 32px 72px;
        border-radius: 8px;
        background: var(--accent);
        font-family: "Inter", sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--canvas);
        box-shadow: 0 0 32px rgba(0, 212, 255, 0.4);
      }
      .cta-url {
        font-family: "JetBrains Mono", "Inter", monospace;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 0.18em;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="book-voice-agent-hero"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div id="scene-cover" class="scene">
        <div class="scene-content">
          <div class="cover-stack">
            <div id="cover-kicker" class="kicker">Deepify Academy</div>
            <img
              id="cover"
              class="cover"
              src="cover.png"
              alt="Build Your Own AI Agent book cover"
            />
            <div id="cover-author" class="author">by <span class="name">Jake Cusack</span></div>
          </div>
        </div>
      </div>

      <div id="scene-tagline" class="scene">
        <div class="scene-content">
          <div id="tagline" class="tagline">
            <span class="line">Build it.</span>
            <span class="line accent">Speak to it.</span>
            <span class="line">Ship it.</span>
            <span class="line accent">today.</span>
          </div>
          <div id="tagline-rule" class="rule"></div>
        </div>
      </div>

      <div id="scene-benefits" class="scene">
        <div class="scene-content">
          <div class="benefits">
            <div id="benefit-1" class="benefit">
              <span class="num">1</span>
              <span>Build <span class="accent">from zero</span></span>
            </div>
            <div id="benefit-2" class="benefit">
              <span class="num">2</span>
              <span>Add <span class="accent">voice</span></span>
            </div>
            <div id="benefit-3" class="benefit">
              <span class="num">3</span>
              <span>Ship <span class="accent">your agent</span></span>
            </div>
          </div>
        </div>
      </div>

      <div id="scene-cta" class="scene">
        <div class="scene-content">
          <div class="cta-wrap">
            <img id="cta-logo" class="cta-logo" src="logo.png" alt="Deepify Academy" />
            <div id="cta-kicker" class="cta-kicker">Available Now</div>
            <div id="cta-title" class="cta-title">Ship your <span class="accent">agent</span></div>
            <div id="cta-button" class="cta-button">Read on Amazon</div>
            <div id="cta-url" class="cta-url">deepify.ai</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.set("#scene-cover", { opacity: 1 }, 0);
      tl.set("#scene-tagline", { opacity: 0 }, 0);
      tl.set("#scene-benefits", { opacity: 0 }, 0);
      tl.set("#scene-cta", { opacity: 0 }, 0);

      tl.from("#cover-kicker", { y: -20, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.from("#cover", { y: 80, opacity: 0, duration: 0.9, ease: "power3.out" }, 0.4);
      tl.from("#cover-author", { y: 20, opacity: 0, duration: 0.6, ease: "expo.out" }, 1.1);

      tl.to("#scene-cover", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.8);
      tl.to("#scene-tagline", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.8);

      tl.from("#tagline", { y: 50, opacity: 0, duration: 0.8, ease: "expo.out" }, 4.2);
      tl.from(
        "#tagline-rule",
        {
          scaleX: 0,
          opacity: 0,
          transformOrigin: "left center",
          duration: 0.7,
          ease: "power3.out",
        },
        5.0,
      );

      tl.to("#scene-tagline", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7.8);
      tl.to("#scene-benefits", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7.8);

      tl.from("#benefit-1", { x: -60, opacity: 0, duration: 0.6, ease: "expo.out" }, 8.2);
      tl.from("#benefit-2", { x: -60, opacity: 0, duration: 0.6, ease: "power3.out" }, 8.9);
      tl.from("#benefit-3", { x: -60, opacity: 0, duration: 0.6, ease: "power2.out" }, 9.6);

      tl.to("#scene-benefits", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 12.8);
      tl.to("#scene-cta", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12.8);

      tl.from("#cta-logo", { scale: 0.7, opacity: 0, duration: 0.5, ease: "expo.out" }, 13.0);
      tl.from("#cta-kicker", { y: -18, opacity: 0, duration: 0.5, ease: "power2.out" }, 13.3);
      tl.from("#cta-title", { y: 36, opacity: 0, duration: 0.6, ease: "expo.out" }, 13.5);
      tl.from("#cta-button", { y: 22, opacity: 0, duration: 0.5, ease: "power3.out" }, 13.9);
      tl.from("#cta-url", { opacity: 0, duration: 0.4, ease: "power2.out" }, 14.2);

      window.__timelines["book-voice-agent-hero"] = tl;
    </script>
  </body>
</html>
