<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Build Your AI Second Brain — 15s promo</title>
    <style>
      :root {
        --canvas-top: #2c4764;
        --canvas-bottom: #3a5f87;
        --text: #ffffff;
        --accent: #3b9fde;
        --muted: #afbcc7;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--canvas-top);
        font-family: "Inter", system-ui, sans-serif;
        color: var(--text);
      }

      [data-composition-id="second-brain-promo"] {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: linear-gradient(180deg, #2c4764 0%, #3a5f87 100%);
        overflow: hidden;
      }

      /* subtle vignette to add depth without banding */
      [data-composition-id="second-brain-promo"]::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 40%,
          rgba(59, 159, 222, 0.08) 0%,
          rgba(0, 0, 0, 0) 60%
        );
        pointer-events: none;
      }

      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }

      .scene-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 120px 200px;
        gap: 32px;
        box-sizing: border-box;
        text-align: center;
      }

      /* scene 1 — cover */
      .cover-wrap {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 96px;
      }
      .cover {
        width: 480px;
        height: 720px;
        object-fit: cover;
        border-radius: 6px;
        box-shadow:
          0 40px 80px rgba(0, 0, 0, 0.45),
          0 12px 28px rgba(0, 0, 0, 0.25);
      }
      .cover-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
        text-align: left;
      }
      .cover-kicker {
        font-family: "Inter", sans-serif;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .cover-title {
        font-family: "Inter Tight", "Inter", sans-serif;
        font-size: 84px;
        font-weight: 800;
        line-height: 0.98;
        letter-spacing: -0.02em;
        max-width: 720px;
      }
      .cover-title .accent {
        color: var(--accent);
      }
      .cover-author {
        font-family: "Inter", sans-serif;
        font-size: 28px;
        font-weight: 400;
        color: var(--muted);
        margin-top: 8px;
      }

      /* scene 2 — tagline */
      .tagline {
        font-family: "Inter Tight", "Inter", sans-serif;
        font-weight: 700;
        font-size: 110px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        max-width: 1500px;
      }
      .tagline .accent {
        color: var(--accent);
      }
      .tagline-rule {
        width: 160px;
        height: 3px;
        background: var(--accent);
        margin-top: 24px;
      }

      /* scene 3 — benefits */
      .benefits {
        display: flex;
        flex-direction: column;
        gap: 44px;
        align-items: flex-start;
        max-width: 1200px;
      }
      .benefit {
        display: flex;
        align-items: center;
        gap: 40px;
        font-family: "Inter Tight", "Inter", sans-serif;
        font-size: 68px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      .benefit .num {
        width: 72px;
        height: 72px;
        border-radius: 8px;
        background: var(--accent);
        color: #0f2339;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", sans-serif;
        font-weight: 800;
        font-size: 34px;
        flex-shrink: 0;
      }
      .benefit .accent {
        color: var(--accent);
      }

      /* scene 4 — cta */
      .cta-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 44px;
      }
      .cta-kicker {
        font-family: "Inter", sans-serif;
        font-size: 22px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .cta-title {
        font-family: "Inter Tight", "Inter", sans-serif;
        font-size: 140px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--text);
      }
      .cta-title .accent {
        color: var(--accent);
      }
      .cta-button {
        display: inline-block;
        padding: 28px 64px;
        border-radius: 6px;
        background: var(--accent);
        font-family: "Inter", sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #0f2339;
      }
      .cta-url {
        font-family: "Inter", sans-serif;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="second-brain-promo"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: Cover (0-4s) -->
      <div id="scene-cover" class="scene">
        <div class="scene-content">
          <div class="cover-wrap">
            <img
              id="cover"
              class="cover"
              src="cover.jpg"
              alt="Build Your AI Second Brain book cover"
            />
            <div id="cover-meta" class="cover-meta">
              <div class="cover-kicker">Deepify Academy · Book 3a</div>
              <div class="cover-title">
                Build Your<br />
                <span class="accent">AI Second Brain</span>
              </div>
              <div class="cover-author">by Jake Cusack</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Scene 2: Tagline (4-8s) -->
      <div id="scene-tagline" class="scene">
        <div class="scene-content">
          <div id="tagline" class="tagline">
            Your knowledge, <span class="accent">remembered.</span><br />
            Your thinking, <span class="accent">accelerated.</span>
          </div>
          <div id="tagline-rule" class="tagline-rule"></div>
        </div>
      </div>

      <!-- Scene 3: Benefits (8-13s) -->
      <div id="scene-benefits" class="scene">
        <div class="scene-content" style="align-items: flex-start">
          <div class="benefits">
            <div id="benefit-1" class="benefit">
              <span class="num">1</span>
              <span>Capture <span class="accent">everything</span></span>
            </div>
            <div id="benefit-2" class="benefit">
              <span class="num">2</span>
              <span>Recall <span class="accent">instantly</span></span>
            </div>
            <div id="benefit-3" class="benefit">
              <span class="num">3</span>
              <span>Think <span class="accent">with AI</span></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Scene 4: CTA (13-15s) -->
      <div id="scene-cta" class="scene">
        <div class="scene-content">
          <div class="cta-wrap">
            <div id="cta-kicker" class="cta-kicker">Available Now</div>
            <div id="cta-title" class="cta-title">
              Start building <span class="accent">today</span>
            </div>
            <div id="cta-button" class="cta-button">Read on Amazon</div>
            <div id="cta-url" class="cta-url">deepify.ai</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene visibility — each scene fades in at its start, out at the next scene's start.
      tl.set("#scene-cover", { opacity: 1 }, 0);
      tl.set("#scene-tagline", { opacity: 0 }, 0);
      tl.set("#scene-benefits", { opacity: 0 }, 0);
      tl.set("#scene-cta", { opacity: 0 }, 0);

      // Scene 1: Cover (0 - 4)
      tl.from("#cover", { y: 80, opacity: 0, duration: 0.9, ease: "power3.out" }, 0.2);
      tl.from(
        "#cover-meta > .cover-kicker",
        { x: 40, opacity: 0, duration: 0.6, ease: "power2.out" },
        0.7,
      );
      tl.from(
        "#cover-meta > .cover-title",
        { y: 30, opacity: 0, duration: 0.7, ease: "expo.out" },
        0.9,
      );
      tl.from(
        "#cover-meta > .cover-author",
        { y: 20, opacity: 0, duration: 0.6, ease: "power2.out" },
        1.3,
      );

      // Crossfade to Scene 2 at 4.0
      tl.to("#scene-cover", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.8);
      tl.to("#scene-tagline", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.8);

      // Scene 2: Tagline (4 - 8)
      tl.from("#tagline", { y: 50, opacity: 0, duration: 0.8, ease: "expo.out" }, 4.2);
      tl.from(
        "#tagline-rule",
        {
          scaleX: 0,
          opacity: 0,
          transformOrigin: "left center",
          duration: 0.7,
          ease: "power3.out",
        },
        5.0,
      );

      // Crossfade to Scene 3 at 8.0
      tl.to("#scene-tagline", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7.8);
      tl.to("#scene-benefits", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7.8);

      // Scene 3: Benefits (8 - 13) — staggered snap-in
      tl.from("#benefit-1", { x: -60, opacity: 0, duration: 0.6, ease: "expo.out" }, 8.2);
      tl.from("#benefit-2", { x: -60, opacity: 0, duration: 0.6, ease: "power3.out" }, 8.9);
      tl.from("#benefit-3", { x: -60, opacity: 0, duration: 0.6, ease: "power2.out" }, 9.6);

      // Crossfade to Scene 4 at 13.0
      tl.to("#scene-benefits", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 12.8);
      tl.to("#scene-cta", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12.8);

      // Scene 4: CTA (13 - 15)
      tl.from("#cta-kicker", { y: -18, opacity: 0, duration: 0.5, ease: "power2.out" }, 13.1);
      tl.from("#cta-title", { y: 36, opacity: 0, duration: 0.7, ease: "expo.out" }, 13.3);
      tl.from("#cta-button", { y: 22, opacity: 0, duration: 0.5, ease: "power3.out" }, 13.8);
      tl.from("#cta-url", { opacity: 0, duration: 0.4, ease: "power2.out" }, 14.1);

      window.__timelines["second-brain-promo"] = tl;
    </script>

    <!-- Audio: see README.md — drop a 15s ambient loop at ./music.mp3 and add an <audio> clip. -->
  </body>
</html>
