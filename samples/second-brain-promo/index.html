<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Build Your Second Brain — 15s promo</title>
    <style>
      :root {
        --canvas: #fff8ec;
        --ink: #2b2620;
        --amber: #f5a623;
        --rose: #c4a3a3;
        --sage: #8faf8c;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--canvas);
        font-family: "Inter", system-ui, sans-serif;
        color: var(--ink);
      }

      [data-composition-id="second-brain-promo"] {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(ellipse at 50% 40%, #fff8ec 0%, #f7eed8 100%);
        overflow: hidden;
      }

      /* paper grain */
      [data-composition-id="second-brain-promo"]::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle at 20% 30%, rgba(43, 38, 32, 0.03) 0, transparent 2px),
          radial-gradient(circle at 70% 60%, rgba(43, 38, 32, 0.02) 0, transparent 2px),
          radial-gradient(circle at 40% 80%, rgba(43, 38, 32, 0.025) 0, transparent 2px);
        background-size:
          50px 50px,
          80px 80px,
          60px 60px;
        pointer-events: none;
      }

      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }

      .scene-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 120px 200px;
        gap: 32px;
        box-sizing: border-box;
        text-align: center;
      }

      /* scene 1 — cover */
      .cover-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 48px;
      }
      .cover {
        width: 360px;
        height: 540px;
        background: linear-gradient(135deg, #2b2620 0%, #3d362d 100%);
        border-radius: 6px;
        box-shadow:
          0 30px 60px rgba(43, 38, 32, 0.25),
          0 8px 20px rgba(43, 38, 32, 0.15);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 48px 36px;
        box-sizing: border-box;
        color: var(--canvas);
        position: relative;
      }
      .cover-label {
        font-family: "Inter", sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--amber);
      }
      .cover-title {
        font-family: "Fraunces", Georgia, serif;
        font-size: 54px;
        font-weight: 500;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      .cover-title em {
        font-style: italic;
        color: var(--amber);
      }
      .cover-footer {
        font-family: "Inter", sans-serif;
        font-size: 16px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--rose);
      }
      .cover-meta {
        font-family: "Fraunces", Georgia, serif;
        font-style: italic;
        font-size: 28px;
        color: var(--ink);
      }

      /* scene 2 — tagline */
      .tagline {
        font-family: "Fraunces", Georgia, serif;
        font-style: italic;
        font-weight: 400;
        font-size: 92px;
        line-height: 1.15;
        letter-spacing: -0.01em;
        max-width: 1400px;
      }
      .tagline .amber {
        color: var(--amber);
        font-style: italic;
      }
      .tagline-rule {
        width: 120px;
        height: 2px;
        background: var(--rose);
        margin-top: 16px;
      }

      /* scene 3 — benefits */
      .benefits {
        display: flex;
        flex-direction: column;
        gap: 48px;
        align-items: flex-start;
        max-width: 1100px;
      }
      .benefit {
        display: flex;
        align-items: center;
        gap: 36px;
        font-family: "Fraunces", Georgia, serif;
        font-size: 64px;
        font-weight: 400;
        color: var(--ink);
        line-height: 1.1;
      }
      .benefit .check {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--sage);
        color: var(--canvas);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 28px;
        flex-shrink: 0;
      }
      .benefit .accent {
        color: var(--amber);
        font-style: italic;
      }

      /* scene 4 — cta */
      .cta-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }
      .cta-kicker {
        font-family: "Inter", sans-serif;
        font-size: 22px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--rose);
      }
      .cta-title {
        font-family: "Fraunces", Georgia, serif;
        font-size: 120px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      .cta-title .amber {
        color: var(--amber);
        font-style: italic;
      }
      .cta-button {
        display: inline-block;
        padding: 28px 64px;
        border: 2px solid var(--ink);
        border-radius: 4px;
        font-family: "Inter", sans-serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--ink);
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="second-brain-promo"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: Cover (0-4s) -->
      <div id="scene-cover" class="scene">
        <div class="scene-content">
          <div class="cover-wrap">
            <div id="cover" class="cover">
              <div class="cover-label">A Beginner's Guide</div>
              <div class="cover-title">Build Your <em>Second</em><br />Brain</div>
              <div class="cover-footer">For Beginners</div>
            </div>
            <div id="cover-meta" class="cover-meta">
              the beginner's guide to note-taking that thinks with you
            </div>
          </div>
        </div>
      </div>

      <!-- Scene 2: Tagline (4-8s) -->
      <div id="scene-tagline" class="scene">
        <div class="scene-content">
          <div id="tagline" class="tagline">
            Your ideas, <span class="amber">organized.</span><br />
            Your thinking, <span class="amber">amplified.</span>
          </div>
          <div id="tagline-rule" class="tagline-rule"></div>
        </div>
      </div>

      <!-- Scene 3: Benefits (8-13s) -->
      <div id="scene-benefits" class="scene">
        <div class="scene-content" style="align-items: flex-start">
          <div class="benefits">
            <div id="benefit-1" class="benefit">
              <span class="check">✓</span>
              <span>Capture <span class="accent">everything</span></span>
            </div>
            <div id="benefit-2" class="benefit">
              <span class="check">✓</span>
              <span>Organize <span class="accent">effortlessly</span></span>
            </div>
            <div id="benefit-3" class="benefit">
              <span class="check">✓</span>
              <span>Think <span class="accent">clearer</span></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Scene 4: CTA (13-15s) -->
      <div id="scene-cta" class="scene">
        <div class="scene-content">
          <div class="cta-wrap">
            <div id="cta-kicker" class="cta-kicker">Available Now</div>
            <div id="cta-title" class="cta-title">
              Start your <span class="amber">second brain</span>
            </div>
            <div id="cta-button" class="cta-button">Read on Amazon</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene visibility — each scene fades in at its start, out at the next scene's start.
      tl.set("#scene-cover", { opacity: 1 }, 0);
      tl.set("#scene-tagline", { opacity: 0 }, 0);
      tl.set("#scene-benefits", { opacity: 0 }, 0);
      tl.set("#scene-cta", { opacity: 0 }, 0);

      // Scene 1: Cover (0 - 4)
      tl.from("#cover", { y: 60, opacity: 0, duration: 1.0, ease: "power2.out" }, 0.2);
      tl.from("#cover-meta", { y: 24, opacity: 0, duration: 0.9, ease: "sine.out" }, 0.9);

      // Crossfade to Scene 2 at 4.0
      tl.to("#scene-cover", { opacity: 0, duration: 0.7, ease: "sine.inOut" }, 3.8);
      tl.to("#scene-tagline", { opacity: 1, duration: 0.7, ease: "sine.inOut" }, 3.8);

      // Scene 2: Tagline (4 - 8)
      tl.from("#tagline", { y: 40, opacity: 0, duration: 1.1, ease: "sine.out" }, 4.2);
      tl.from(
        "#tagline-rule",
        {
          scaleX: 0,
          opacity: 0,
          transformOrigin: "left center",
          duration: 0.8,
          ease: "power1.out",
        },
        5.1,
      );

      // Crossfade to Scene 3 at 8.0
      tl.to("#scene-tagline", { opacity: 0, duration: 0.7, ease: "sine.inOut" }, 7.8);
      tl.to("#scene-benefits", { opacity: 1, duration: 0.7, ease: "sine.inOut" }, 7.8);

      // Scene 3: Benefits (8 - 13) — staggered drift in
      tl.from("#benefit-1", { x: -50, opacity: 0, duration: 0.8, ease: "power1.out" }, 8.2);
      tl.from("#benefit-2", { x: -50, opacity: 0, duration: 0.8, ease: "sine.out" }, 8.9);
      tl.from("#benefit-3", { x: -50, opacity: 0, duration: 0.8, ease: "power2.out" }, 9.6);

      // Crossfade to Scene 4 at 13.0
      tl.to("#scene-benefits", { opacity: 0, duration: 0.6, ease: "sine.inOut" }, 12.8);
      tl.to("#scene-cta", { opacity: 1, duration: 0.6, ease: "sine.inOut" }, 12.8);

      // Scene 4: CTA (13 - 15)
      tl.from("#cta-kicker", { y: -16, opacity: 0, duration: 0.6, ease: "sine.out" }, 13.1);
      tl.from("#cta-title", { y: 30, opacity: 0, duration: 0.8, ease: "power1.out" }, 13.3);
      tl.from("#cta-button", { y: 20, opacity: 0, duration: 0.6, ease: "sine.inOut" }, 13.8);

      // Final fade out — only the last scene exits (per scene-transition rules)
      tl.to("#scene-cta", { opacity: 1, duration: 0.01 }, 14.99);

      window.__timelines["second-brain-promo"] = tl;
    </script>

    <!-- Audio: see README.md — drop a 15s ambient loop at ./music.mp3 and add an <audio> clip. -->
  </body>
</html>
